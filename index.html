<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Payet Primeur Pro</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root { 
            --primary: #27ae60; --primary-light: #ecfdf5; --primary-dark: #1e8449;
            --secondary: #3b82f6; --bg: #f8fafc; --text: #0f172a; --text-light: #64748b;
            --selve-color: #10b981; --ville-color: #3b82f6;
            --radius: 16px; --shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); 
            color: var(--text); margin: 0; padding-bottom: 40px; line-height: 1.5;
        }

        /* Header & Navigation */
        header { 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; padding: 30px 20px; text-align: center; font-weight: 800; 
            font-size: 1.4rem; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            box-shadow: 0 4px 20px rgba(39, 174, 96, 0.2);
        }
        
        .tabs { 
            display: flex; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            margin: -25px 20px 20px 20px; border-radius: var(--radius); padding: 6px;
            box-shadow: var(--shadow); position: sticky; top: 10px; z-index: 100;
        }

        .tab { 
            flex: 1; padding: 12px 5px; text-align: center; cursor: pointer; font-size: 0.75rem; 
            font-weight: 700; color: var(--text-light); border-radius: 12px; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .tab.active { background: white; color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .content { padding: 0 20px; max-width: 650px; margin: 0 auto; display: none; }
        .content.active { display: block; animation: slideUp 0.4s ease-out; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Stock Cards */
        .product-card { 
            background: white; margin-bottom: 12px; padding: 16px; border-radius: var(--radius); 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: var(--shadow); border: 1px solid rgba(241, 245, 249, 1);
        }
        .controls { display: flex; align-items: center; gap: 12px; background: #f1f5f9; padding: 6px; border-radius: 14px; }
        .btn-qty { 
            width: 38px; height: 38px; border: none; background: white; border-radius: 10px; 
            font-size: 1.2rem; font-weight: bold; color: var(--primary); cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .btn-qty:active { transform: scale(0.9); }
        .qty-val { font-size: 1.1rem; font-weight: 800; min-width: 35px; text-align: center; }

        /* Calendar */
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .calendar-day { 
            aspect-ratio: 1/1; background: white; border-radius: 14px; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            font-weight: 700; font-size: 0.95rem; position: relative; transition: 0.2s;
            box-shadow: var(--shadow); border: 1px solid #f1f5f9; cursor: pointer;
        }
        .calendar-day.today { background: var(--primary); color: white; border: none; transform: scale(1.05); }
        .dot-box { display: flex; gap: 3px; position: absolute; bottom: 8px; }
        .dot { width: 5px; height: 5px; border-radius: 50%; border: 1px solid white; }
        .dot-s { background: var(--selve-color); }
        .dot-v { background: var(--ville-color); }

        /* Reservations List */
        .res-item { 
            background: white; padding: 18px; border-radius: var(--radius); margin-bottom: 12px; 
            border-left: 6px solid #cbd5e1; display: flex; justify-content: space-between; 
            align-items: center; box-shadow: var(--shadow);
        }
        .res-item.st-selve { border-left-color: var(--selve-color); }
        .res-item.villenave { border-left-color: var(--ville-color); }

        /* Modal & Inputs Harmonisés */
        .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-box { 
            background: white; padding: 25px; border-radius: 24px; width: 100%; max-width: 450px; 
            max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.2);
        }
        
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; margin-bottom: 6px; margin-left: 4px; }
        
        /* STYLE UNIQUE POUR TOUS LES INPUTS */
        input, select, textarea { 
            width: 100%; padding: 14px; border: 2px solid #f1f5f9; border-radius: 14px; 
            font-size: 1rem; font-family: inherit; background: #f8fafc; color: var(--text);
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary); background: white; outline: none; 
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .group-divider { 
            padding: 15px; background: #f8fafc; border-radius: 18px; margin-bottom: 15px; 
            border: 1px solid #f1f5f9; position: relative;
        }
        .group-num { font-size: 0.65rem; color: var(--primary); font-weight: 900; position: absolute; top: 10px; right: 15px; }

        .btn-confirm { 
            width: 100%; padding: 18px; border: none; border-radius: 16px; font-weight: 800; 
            font-size: 1rem; cursor: pointer; background: var(--primary); color: white; 
            box-shadow: 0 10px 15px -3px rgba(39, 174, 96, 0.3); margin-top: 10px;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>PAYET PRIMEUR</header>

<div class="tabs">
    <div class="tab active" id="tab-st-selve" onclick="switchTab('st-selve')">St Selve</div>
    <div class="tab" id="tab-villenave" onclick="switchTab('villenave')">Villenave</div>
    <div class="tab" id="tab-agenda" onclick="switchTab('agenda')">Agenda</div>
    <div class="tab" id="tab-admin" onclick="switchTab('admin')">Admin</div>
</div>

<div id="view-stock" class="content active">
    <div id="product-list"></div>
</div>

<div id="view-agenda" class="content">
    <div class="cal-nav">
        <button onclick="changeMonth(-1)" style="border:none; background:white; width:40px; height:40px; border-radius:12px; box-shadow:var(--shadow); font-weight:bold;">❮</button>
        <h3 id="cal-month" style="margin:0; font-weight:800; text-transform: capitalize;"></h3>
        <button onclick="changeMonth(1)" style="border:none; background:white; width:40px; height:40px; border-radius:12px; box-shadow:var(--shadow); font-weight:bold;">❯</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
    <div id="day-details" style="margin-top:30px;"></div>
</div>

<div id="view-admin" class="content">
    <div style="background:white; padding:20px; border-radius:24px; box-shadow:var(--shadow);">
        <h3 style="margin-top:0;">Administration</h3>
        <button class="btn-confirm" onclick="generatePDF()" style="background:#1e293b; margin-bottom:12px;">📄 Télécharger Stock (PDF)</button>
        <button class="btn-confirm" onclick="resetStocks()" style="background:white; color:#e11d48; border:2px solid #fecdd3; box-shadow:none;">🔄 Remise à zéro des stocks</button>
    </div>
    <div id="admin-p-list" style="margin-top:25px;"></div>
</div>

<div id="modal-res" class="modal hidden">
    <div class="modal-box">
        <h3 id="res-date-title" style="margin:0 0 20px 0; font-weight:900;">Nouvelle Commande</h3>
        
        <div class="field">
            <label>Lieu de retrait</label>
            <select id="res-boutique">
                <option value="st-selve">🏡 Saint Selve</option>
                <option value="villenave">🏪 Villenave</option>
            </select>
        </div>

        <div class="field">
            <label>Type de produit</label>
            <select id="res-type" onchange="toggleForm()">
                <option value="retrait">📦 Retrait Libre</option>
                <option value="panier">🧺 Panier (10/20€)</option>
                <option value="panier-garni">🎁 Panier Garni</option>
                <option value="plateau">🍽️ Plateau</option>
            </select>
        </div>

        <div id="field-prix" class="field hidden">
            <label>Budget</label>
            <select id="res-prix"><option value="10€">10€</option><option value="20€">20€</option></select>
        </div>

        <div class="field">
            <label>Note / Détails</label>
            <textarea id="res-desc" rows="2" placeholder="Ex: Pas de poireaux..."></textarea>
        </div>

        <div id="section-unique">
            <div class="field">
                <label>Nom du client</label>
                <input type="text" id="res-name" placeholder="Ex: Jean Dupont">
            </div>
            <div class="field">
                <label>Téléphone</label>
                <input type="tel" id="res-tel" placeholder="06 .. .. .. ..">
            </div>
        </div>

        <div id="section-multiple" class="hidden">
            <div class="field">
                <label>Nombre de personnes</label>
                <input type="number" id="res-count" value="1" min="1" max="20" oninput="drawMultiFields()">
            </div>
            <div id="multi-container"></div>
        </div>

        <button onclick="saveRes()" class="btn-confirm">ENREGISTRER</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; color:var(--text-light); padding:15px; font-weight:700; cursor:pointer;">Annuler</button>
    </div>
</div>

<script>
    const fb = { databaseURL: "https://stock-romain-default-rtdb.europe-west1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(fb);
    const db = firebase.database();

    let curSite = 'st-selve', data = { products: [], stocks: {}, reservations: {} }, viewDate = new Date(), selDate = null;

    db.ref('/').on('value', (snap) => {
        const d = snap.val() || {};
        data = { products: d.products || [], stocks: d.stocks || {}, reservations: d.reservations || {} };
        renderAll();
    });

    function renderAll() { renderStock(); renderCalendar(); if(selDate) showDay(selDate); }

    function switchTab(t) {
        document.querySelectorAll('.tab, .content').forEach(el => el.classList.remove('active'));
        if(t === 'agenda') { document.getElementById('view-agenda').classList.add('active'); document.getElementById('tab-agenda').classList.add('active'); }
        else if(t === 'admin') { document.getElementById('view-admin').classList.add('active'); document.getElementById('tab-admin').classList.add('active'); renderAdmin(); }
        else { curSite = t; document.getElementById('view-stock').classList.add('active'); document.getElementById('tab-'+t).classList.add('active'); renderStock(); }
    }

    function renderStock() {
        const cont = document.getElementById('product-list'); cont.innerHTML = '';
        ["Fruit", "Légume", "Aromate", "Épicerie"].forEach(c => {
            const items = data.products.filter(p => p.c === c);
            if(items.length) {
                cont.innerHTML += `<div style="margin:25px 0 12px 5px; font-size:0.75rem; font-weight:900; color:var(--text-light); text-transform:uppercase; letter-spacing:1px;">${c}s</div>`;
                items.forEach(p => {
                    const q = (data.stocks[p.n] && data.stocks[p.n][curSite]) || 0;
                    cont.innerHTML += `<div class="product-card"><span><b>${p.n}</b></span><div class="controls">
                        <button class="btn-qty" onclick="updQty('${p.n}',-1)">-</button>
                        <div class="qty-val">${q}</div>
                        <button class="btn-qty" onclick="updQty('${p.n}',1)">+</button>
                    </div></div>`;
                });
            }
        });
    }

    function updQty(n, v) {
        if(!data.stocks[n]) data.stocks[n] = {'st-selve':0, 'villenave':0};
        data.stocks[n][curSite] = Math.max(0, (data.stocks[n][curSite]||0) + v);
        db.ref('stocks/'+n).set(data.stocks[n]);
    }

    function changeMonth(o) { viewDate.setMonth(viewDate.getMonth() + o); renderCalendar(); }
    
    function renderCalendar() {
        const grid = document.getElementById('calendar-grid'); grid.innerHTML = '';
        const m = viewDate.getMonth(), y = viewDate.getFullYear();
        document.getElementById('cal-month').innerText = viewDate.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
        const days = new Date(y, m + 1, 0).getDate();

        for(let d=1; d<=days; d++) {
            const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const el = document.createElement('div'); el.className = 'calendar-day';
            el.innerHTML = `<span>${d}</span>`;
            if(d === new Date().getDate() && m === new Date().getMonth() && y === new Date().getFullYear()) el.classList.add('today');

            const res = Object.values(data.reservations).filter(r => r.date === dStr);
            if(res.length) {
                let dots = '<div class="dot-box">';
                if(res.some(r => r.boutique === 'st-selve')) dots += '<div class="dot dot-s"></div>';
                if(res.some(r => r.boutique === 'villenave')) dots += '<div class="dot dot-v"></div>';
                el.innerHTML += dots + '</div>';
            }
            el.onclick = () => { selDate = dStr; showDay(dStr); };
            grid.appendChild(el);
        }
    }

    function showDay(d) {
        const cont = document.getElementById('day-details');
        const res = Object.entries(data.reservations).filter(([id, r]) => r.date === d);
        let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h4 style="margin:0; font-weight:900;">Le ${d}</h4>
            <button onclick="openModal('${d}')" style="background:var(--primary); color:white; border:none; padding:10px 18px; border-radius:12px; font-weight:800; cursor:pointer;">+ Ajouter</button>
        </div>`;
        if(!res.length) html += `<div style="text-align:center; padding:40px; background:white; border-radius:20px; color:var(--text-light); font-weight:600;">Aucune commande.</div>`;
        else {
            res.forEach(([id, r]) => {
                html += `<div class="res-item ${r.boutique}">
                    <div><small style="font-weight:800; color:var(--text-light); font-size:0.65rem;">${r.boutique.toUpperCase()}</small><br>
                    <b>${r.client}</b><br>
                    ${r.tel ? `<span style="color:var(--secondary); font-size:0.9rem; font-weight:700;">📞 ${r.tel}</span><br>` : ''}
                    <span style="font-size:0.85rem;">${r.type} ${r.prix||''}</span>
                    ${r.desc ? `<div style="font-size:0.8rem; color:var(--text-light); font-style:italic; margin-top:4px;">"${r.desc}"</div>` : ''}</div>
                    <button onclick="delRes('${id}')" style="background:#fff1f2; border:none; padding:12px; border-radius:12px; color:#e11d48; cursor:pointer; font-size:1.1rem;">🗑️</button>
                </div>`;
            });
        }
        cont.innerHTML = html; cont.scrollIntoView({behavior:'smooth'});
    }

    function openModal(d) { selDate = d; document.getElementById('modal-res').classList.remove('hidden'); toggleForm(); }
    function closeModal() { document.getElementById('modal-res').classList.add('hidden'); }
    
    function toggleForm() {
        const t = document.getElementById('res-type').value;
        const isM = (t !== 'retrait');
        document.getElementById('field-prix').classList.toggle('hidden', t !== 'panier');
        document.getElementById('section-multiple').classList.toggle('hidden', !isM);
        document.getElementById('section-unique').classList.toggle('hidden', isM);
        if(isM) drawMultiFields();
    }

    function drawMultiFields() {
        const c = Math.min(document.getElementById('res-count').value, 20);
        const cont = document.getElementById('multi-container'); cont.innerHTML = '';
        for(let i=0; i<c; i++) {
            cont.innerHTML += `<div class="group-divider">
                <span class="group-num">CLIENT ${i+1}</span>
                <input type="text" class="g-name" placeholder="Nom du client" style="margin-top:10px;">
                <input type="tel" class="g-tel" placeholder="Numéro de téléphone" style="margin-bottom:0;">
            </div>`;
        }
    }

    function saveRes() {
        const b = document.getElementById('res-boutique').value, t = document.getElementById('res-type').value, d = document.getElementById('res-desc').value;
        const label = document.getElementById('res-type').options[document.getElementById('res-type').selectedIndex].text;
        
        if(t === 'retrait') {
            const n = document.getElementById('res-name').value, tel = document.getElementById('res-tel').value;
            if(n) pushToDb(b, label, n, tel, null, d);
        } else {
            const p = (t === 'panier') ? document.getElementById('res-prix').value : null;
            document.querySelectorAll('.group-divider').forEach(el => {
                const n = el.querySelector('.g-name').value, tel = el.querySelector('.g-tel').value;
                if(n) pushToDb(b, label, n, tel, p, d);
            });
        }
        document.getElementById('res-name').value = ''; document.getElementById('res-tel').value = ''; document.getElementById('res-desc').value = '';
        closeModal();
    }

    function pushToDb(boutique, type, client, tel, prix, desc) {
        db.ref('reservations').push({ date: selDate, boutique, type, client, tel: tel||'', prix, desc, ts: Date.now() });
    }

    function delRes(id) { if(confirm("Supprimer cette commande ?")) db.ref('reservations/'+id).remove(); }

    function renderAdmin() {
        const cont = document.getElementById('admin-p-list'); cont.innerHTML = "<h4 style='color:var(--text-light); text-transform:uppercase; font-size:0.75rem; margin-bottom:15px;'>Produits Actuels</h4>";
        data.products.forEach(p => {
            cont.innerHTML += `<div style="display:flex; justify-content:space-between; background:white; padding:15px; margin-bottom:8px; border-radius:15px; box-shadow:var(--shadow); align-items:center;">
                <span style="font-weight:800;">${p.n}</span>
                <button onclick="delProd('${p.n}')" style="color:#ef4444; border:none; background:none; font-weight:800; cursor:pointer;">Supprimer</button>
            </div>`;
        });
    }

    function delProd(n) { if(confirm("Retirer du catalogue ?")) { db.ref('products').set(data.products.filter(p => p.n !== n)); db.ref('stocks/'+n).remove(); }}
    function resetStocks() { if(confirm("Vider tous les stocks ?")) { const r = {}; data.products.forEach(p => r[p.n] = {'st-selve':0, 'villenave':0}); db.ref('stocks').set(r); }}
    
    function generatePDF() {
        const { jsPDF } = window.jspdf; const doc = new jsPDF();
        doc.setFontSize(22); doc.setTextColor(39, 174, 96); doc.text("INVENTAIRE PAYET PRIMEUR", 14, 20);
        const rows = [];
        data.products.forEach(p => {
            const s = data.stocks[p.n] || { 'st-selve':0, 'villenave':0 };
            const tot = (s['st-selve']||0) + (s['villenave']||0);
            if(tot > 0) rows.push([p.c, p.n, s['st-selve'], s['villenave'], tot]);
        });
        doc.autoTable({ head: [['Catégorie', 'Produit', 'St Selve', 'Villenave', 'TOTAL']], body: rows, startY: 30, headStyles: {fillColor: [39, 174, 96]} });
        doc.save(`Inventaire_${new Date().toLocaleDateString()}.pdf`);
    }
</script>
</body>
</html>
